name: 中文文档与 Pages
on:
  push:
    branches: [lang/cn]
  pull_request:
    branches: [lang/cn]

permissions:
  contents: read

concurrency:
  group: pages-cn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-docs.lock
      - name: 安装锁定的文档依赖
        run: python -m pip install --require-hashes -r requirements-docs.lock
      - name: 严格构建与静态检查
        run: |
          python -m sphinx -a -b html -d docs/_build/doctrees -W --keep-going docs docs/_build/html
          python tools/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - name: 安装浏览器检查依赖
        working-directory: tools/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 桌面与手机交互检查
        working-directory: tools/browser
        run: npm test
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: docs/_build/html
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lang/cn'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
