{% extends "!layout.html" %}
{% block extrahead %}
{{ super() }}
<meta name="description" content="{{ title | striptags | e }} — Python 速查表，包含基础语法、并发、网络、数据库、LLM 与 HPC 的实用示例。">
<meta name="author" content="crazyguitar">
<meta property="og:url" content="{{ site_pageurl }}">
<meta property="og:type" content="{{ 'website' if pagename == 'index' else 'article' }}">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="{{ title | striptags | e }}{{ titlesuffix }}">
<meta property="og:description" content="Python 速查表：实用代码示例与简体中文说明。">
<meta property="og:site_name" content="Python 速查表">
<meta property="og:image" content="{{ site_baseurl }}_static/logo.png">
<meta property="og:image:alt" content="pysheeet 标志">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ title | striptags | e }}{{ titlesuffix }}">
<meta name="twitter:description" content="Python 实用代码示例与简体中文说明。">
<meta name="twitter:image" content="{{ site_baseurl }}_static/logo.png">
<script type="application/ld+json">{{ {
  '@context': 'https://schema.org', '@type': 'WebSite' if pagename == 'index' else 'TechArticle',
  'name': title | striptags, 'url': site_pageurl, 'inLanguage': 'zh-CN',
  'author': {'@type': 'Person', 'name': 'crazyguitar', 'url': 'https://github.com/crazyguitar'}
} | tojson }}</script>
{% if tracking_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ tracking_id }}"></script>
<script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', {{ tracking_id | tojson }});</script>
{% endif %}
{% endblock %}
{% block docs_toc %}
{% if cn_page_sections %}
<aside id="cn-page-toc" aria-label="本页目录">
  <details open>
    <summary>本页目录（Contents）</summary>
    <nav id="cn-toc-scroll" aria-label="章节导航" tabindex="0">
      <ol>
      {% for section in cn_page_sections %}
        <li style="--toc-depth: {{ section.depth }}"><a href="#{{ section.id | e }}">{{ section.title | e }}</a></li>
      {% endfor %}
      </ol>
    </nav>
  </details>
</aside>
{% endif %}
{% endblock %}
